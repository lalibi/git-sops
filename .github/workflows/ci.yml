name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Build the tagged CLI for the cross-version integration test.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Config-based hooks need a recent Git.
      - name: Install Git and git-crypt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git git-crypt

      - name: Update Git (macOS)
        if: runner.os == 'macOS'
        run: brew upgrade git || brew install git

      - run: git --version

      - run: go vet ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Install sops
        run: go run ./cmd/git-sops install-sops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: go test -timeout 30m ./...

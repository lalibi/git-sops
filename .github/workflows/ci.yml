name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Build the tagged CLI for the cross-version integration test.
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # Config-based hooks need a recent Git.
      - name: Install Git and git-crypt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git git-crypt

      - name: Update Git (macOS)
        if: runner.os == 'macOS'
        run: |
          if brew list --versions git >/dev/null; then
            outdated=$(brew outdated --quiet --formula git)
            if [[ -n "$outdated" ]]; then
              brew upgrade git
            fi
          else
            brew install git
          fi

      - run: git --version

      - run: go vet ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Install sops
        run: go run ./cmd/git-sops install-sops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: go test -timeout 30m ./...
